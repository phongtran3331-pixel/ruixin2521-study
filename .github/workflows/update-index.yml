name: 更新文件索引

on:
  push:
    branches: [main]
    paths:
      - 'class_files/**'
      - 'notices/**'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 重新扫描 class_files 与 notices
        run: python3 scripts/scan_all.py

      - name: 提交索引变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/class_files_index.json data/notices_index.json
          if git diff --cached --quiet; then
            echo "索引无变化"
          else
            git commit -m "chore: 自动更新文件索引 [skip ci]"
            git push
          fi
